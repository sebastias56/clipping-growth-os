spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clipping_growth}
spring.datasource.username=${DB_USERNAME:clipping_growth}
spring.datasource.password=${DB_PASSWORD:clipping_growth}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

media-worker.base-url=${MEDIA_WORKER_BASE_URL:http://localhost:8001}
media-worker.connect-timeout=1s
media-worker.read-timeout=2s

media.storage.local.root=${MEDIA_STORAGE_ROOT:${user.home}/.clipping-growth-os/media}
