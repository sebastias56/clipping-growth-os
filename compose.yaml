services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clipping_growth
      POSTGRES_USER: clipping_growth
      POSTGRES_PASSWORD: clipping_growth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
